<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>육아답 프로젝트 - 육아고사</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap');

:root{
  --paper:#FFFCF3;
  --dotgrid:#EAE2CC;
  --ink:#221D17;
  --ink-soft:#5A5347;
  --pink:#FFC9D6;
  --pink-d:#F79CB4;
  --blue:#BFE3FF;
  --blue-d:#8FCBFF;
  --mint:#C9F2D8;
  --mint-d:#8FE0B4;
  --yellow:#FFE79A;
  --yellow-d:#FFD65C;
  --lav:#E4D8FF;
  --lav-d:#C9B6FF;
  --card:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background-color:var(--paper);
  background-image:radial-gradient(circle, var(--dotgrid) 1.3px, transparent 1.3px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:720px;margin:0 auto;padding:30px 18px 70px;min-height:100vh;}

h1,h2,.font-display{font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-weight:700;}

/* ---- brand ---- */
.brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.brand svg{width:34px;height:34px;flex:none;}
.brand-name{font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif;font-size:18px;font-weight:700;}

.screen{display:none;}
.screen.active{display:block; animation:fadeUp .45s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---- sketch base ---- */
.sketch{position:relative; border:2.5px solid var(--ink); z-index:0; background:var(--card);}
.sketch::before{content:'';position:absolute;inset:-5px;border:2px solid var(--ink);opacity:.28;border-radius:inherit;z-index:-1;}
.wob-1{border-radius:255px 18px 225px 30px/28px 225px 30px 255px;}
.wob-2{border-radius:22px 240px 24px 235px/235px 24px 240px 22px;}
.wob-3{border-radius:235px 26px 235px 26px/26px 235px 26px 235px;}
.tilt-1{transform:rotate(-1.1deg);}
.tilt-2{transform:rotate(0.9deg);}
.tilt-3{transform:rotate(-0.5deg);}

.sticker-tag{
  display:inline-block; font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700;
  background:var(--lav); border:2px solid var(--ink); border-radius:255px 20px 225px 20px/20px 225px 20px 255px;
  padding:3px 14px; transform:rotate(-2deg); margin-bottom:14px;
}

h1{font-size:clamp(28px,6.4vw,42px); line-height:1.28; margin:0 0 14px;}
h1 .hl{color:var(--ink); text-decoration:underline; text-decoration-style:wavy; text-decoration-color:var(--pink-d); text-decoration-thickness:3px; text-underline-offset:5px;}
p.lede{font-size:18px; line-height:1.6; color:var(--ink-soft); max-width:52ch; margin:0 0 26px;}

/* ---- fields / buttons ---- */
.field{margin-bottom:20px;}
.field label{display:block; font-size:16px; margin-bottom:7px;}
input[type=text]{
  width:100%; padding:12px 14px; border:2.5px solid var(--ink); border-radius:16px 8px 16px 8px;
  background:#fff; font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:14px; color:var(--ink); outline:none;
}
input[type=text]:focus{background:var(--yellow);}

.btn{
  appearance:none; cursor:pointer; font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:14px; font-weight:700;
  border:2.5px solid var(--ink); border-radius:255px 20px 225px 20px/20px 225px 20px 255px;
  padding:13px 20px; background:#fff; box-shadow:3px 3px 0 var(--ink);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink);}
.btn:active{transform:translate(0,0); box-shadow:1px 1px 0 var(--ink);}
.btn-primary{background:var(--lav); width:100%;}
.btn-ghost{background:#fff;}
.btn-small{padding:8px 14px; font-size:14px;}

.code-box{display:flex; gap:8px;}
.code-box input{flex:1;}
.hint{font-size:14px; color:var(--ink-soft); margin-top:8px; line-height:1.5;}

/* ---- bracket ---- */
.bracket{display:flex; align-items:center; margin-bottom:24px;}
.bracket .dot-wrap{display:flex; align-items:center; flex:1;}
.bracket .dot{
  width:24px;height:24px; border:2px solid var(--ink); background:#fff;
  border-radius:50% 45% 55% 48%/48% 52% 45% 55%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:11px; font-weight:700; flex:none;
}
.bracket .dot.done{background:var(--mint);}
.bracket .dot.current{background:var(--lav); box-shadow:2px 2px 0 var(--ink);}
.bracket .seg{flex:1; height:0; border-top:2px dashed var(--ink-soft); opacity:.5;}
.bracket .seg.done{border-top:2px dashed var(--ink); opacity:1;}

.round-label{font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:13px; font-weight:700; color:var(--pink-d); margin-bottom:10px;}
.q-title{font-size:clamp(20px,4.6vw,25px); margin:0 0 6px; line-height:1.35;}
.q-sub{color:var(--ink-soft); font-size:15px; margin:0 0 22px;}

.matchup{position:relative; display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.vs-badge{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-8deg);
  width:46px;height:46px; background:var(--yellow); border:2.5px solid var(--ink);
  border-radius:238px 16px 225px 30px/26px 225px 30px 238px;
  display:flex;align-items:center;justify-content:center; z-index:2;
  font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:12px; font-weight:700; box-shadow:2px 2px 0 var(--ink);
}
.opt-card{
  padding:22px 16px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px;
  min-height:130px; width:100%; transition:transform .12s ease;
}
.opt-card:hover{transform:translateY(-3px) rotate(0deg) !important;}
.opt-card .tag{
  font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:12px; font-weight:700; width:24px;height:24px;
  border:1.5px solid var(--ink); border-radius:50%; display:flex;align-items:center;justify-content:center;
}
.opt-card .opt-label{font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:16px; font-weight:700; line-height:1.5;}

@media (max-width:560px){
  .matchup{grid-template-columns:1fr; gap:36px;}
  .vs-badge{top:calc(50% - 12px);}
}

/* ---- share / result ---- */
.result-hero{text-align:center; padding:34px 20px 26px; margin-bottom:22px; position:relative; overflow:visible;}
.result-hero .stk{position:absolute; width:26px;height:26px;}
.result-hero .stk.s1{top:6px; left:14px; transform:rotate(-15deg);}
.result-hero .stk.s2{top:10px; right:18px; transform:rotate(20deg);}
.result-hero .stk.s3{bottom:14px; left:22px; transform:rotate(10deg);}
.result-eyebrow{font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:13px; font-weight:700; color:var(--pink-d); margin-bottom:6px;}
.result-score{font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif; font-size:clamp(26px,7vw,34px); font-weight:700; margin:0 0 12px;}
.result-message{font-size:16px; color:var(--ink); line-height:1.65; max-width:46ch; margin:0 auto;}

.answers-list{padding:20px; margin-bottom:20px;}
.answer-row{padding:14px 0; border-bottom:1.5px dashed var(--dotgrid);}
.answer-row:last-child{border-bottom:none;}
.answer-q{font-size:14.5px; font-weight:700; margin-bottom:8px;}
.answer-compare{display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:13.5px; color:var(--ink-soft);}
.answer-compare .who{font-weight:700; color:var(--ink);}
.answer-compare .mark{margin-left:auto; font-size:16px;}
.answer-row.wrong{background:#FFF6F0;}

footer.foot{text-align:center; margin-top:36px; font-size:12px; color:var(--ink-soft); font-family:'Nanum Gothic', 'Malgun Gothic', sans-serif;}
</style>
</head>
<body>
<div class="app">

<div class="brand">
<svg viewBox="0 0 64 64"><circle cx="32" cy="36" r="20" fill="#FFF6E0" stroke="var(--ink)" stroke-width="2.5"/><circle cx="24" cy="34" r="2" fill="var(--ink)"/><circle cx="40" cy="34" r="2" fill="var(--ink)"/><path d="M24 44 Q32 50 40 44" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><path d="M28 14 Q32 6 36 14" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="18" cy="40" rx="3" ry="2" fill="var(--pink)"/><ellipse cx="46" cy="40" rx="3" ry="2" fill="var(--pink)"/></svg>
<div class="brand-name">육아답 프로젝트 · 육아고사</div>
</div>

<!-- START SCREEN (아내가 시작) -->
<section id="screen-start" class="screen active">
<span class="sticker-tag">📝 육아고사 OPEN!</span>
<h1>우리 부부는<br><span class="hl">얼마나 잘 통할까?</span></h1>
<p class="lede">아내가 먼저 10개 질문에 솔직하게 답하면, 남편이 그 답을 얼마나 맞히는지 확인하는 게임이에요. 아내가 먼저 시작해주세요.</p>

<div class="field">
<label for="input-name">이름을 남겨볼까요? (안 써도 괜찮아요)</label>
<input type="text" id="input-name" placeholder="예: 민준맘">
</div>

<button class="btn btn-primary" onclick="startWifeQuiz()">육아고사 시작하기 →</button>
</section>

<!-- CHALLENGE INTRO SCREEN (남편이 링크로 진입) -->
<section id="screen-challenge" class="screen">
<span class="sticker-tag">💌 도전장이 도착했어요</span>
<h1 id="challenge-title">육아고사 도전장</h1>
<p class="lede">아내가 먼저 10개 질문에 답했어요. 남편이 그 답을 얼마나 맞히는지 도전해보세요.</p>
<button class="btn btn-primary" onclick="startHusbandQuiz()">도전하기 →</button>
<p class="hint" id="challenge-error"></p>
</section>

<!-- QUIZ SCREEN (아내/남편 공용) -->
<section id="screen-quiz" class="screen">
<div class="bracket" id="bracket"></div>
<div class="round-label" id="round-label"></div>
<h2 class="q-title" id="q-title"></h2>
<p class="q-sub" id="q-sub"></p>
<div class="matchup">
<div class="vs-badge">VS</div>
<button class="opt-card sketch wob-1 tilt-1" id="opt-a" onclick="choose('a')">
<span class="tag">A</span>
<span class="opt-label" id="opt-a-label"></span>
</button>
<button class="opt-card sketch wob-2 tilt-2" id="opt-b" onclick="choose('b')">
<span class="tag">B</span>
<span class="opt-label" id="opt-b-label"></span>
</button>
</div>
</section>

<!-- SHARE SCREEN (아내 제출 완료) -->
<section id="screen-share" class="screen">
<div class="result-hero sketch wob-3 tilt-3">
<svg class="stk s1" viewBox="0 0 24 24"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--yellow-d)" stroke="var(--ink)" stroke-width="1.5"/></svg>
<svg class="stk s2" viewBox="0 0 24 24"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="1.5"/></svg>
<svg class="stk s3" viewBox="0 0 24 24"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--mint-d)" stroke="var(--ink)" stroke-width="1.5"/></svg>
<div class="result-eyebrow">제출 완료!</div>
<h2 class="result-score">이제 남편 차례예요</h2>
<p class="result-message">아래 링크를 복사해서 남편에게 보내세요. 링크를 누르면 도전이 시작돼요.</p>
</div>
<div class="code-box">
<input type="text" id="my-code" readonly>
<button class="btn btn-ghost btn-small" onclick="copyCode()">링크 복사</button>
</div>
<p class="hint" id="copy-msg"></p>
</section>

<!-- RESULT SCREEN (남편 도전 완료) -->
<section id="screen-result" class="screen">
<div class="result-hero sketch wob-3 tilt-3">
<svg class="stk s1" viewBox="0 0 24 24"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--yellow-d)" stroke="var(--ink)" stroke-width="1.5"/></svg>
<svg class="stk s2" viewBox="0 0 24 24"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="1.5"/></svg>
<svg class="stk s3" viewBox="0 0 24 24"><path d="M12 2 L14 10 L22 12 L14 14 L12 22 L10 14 L2 12 L10 10 Z" fill="var(--mint-d)" stroke="var(--ink)" stroke-width="1.5"/></svg>
<div class="result-eyebrow" id="result-eyebrow"></div>
<h2 class="result-score" id="result-score"></h2>
<p class="result-message" id="result-message"></p>
</div>
<div class="answers-list sketch wob-2 tilt-1" id="answers-list"></div>
<button class="btn btn-ghost" style="width:100%;" onclick="location.href=location.pathname">처음으로</button>
</section>

<footer class="foot">☁ 육아답 · 프로토타입 버전 · 데이터는 공유 링크로만 확인돼요 ☁</footer>
</div>

<script>
const QUESTIONS = [
  { q: '아이 얼굴, SNS에 공개해도 될까?', a: '공개해도 된다', b: '공개하지 않는다' },
  { q: '아이 훈육, 어떻게 해야 할까?', a: '단호하게 화내는 것도 필요하다', b: '항상 차분한 목소리로 타일러야 한다' },
  { q: '스마트폰·미디어, 언제부터 보여줄까?', a: '최대한 늦게 보여준다', b: '적당히 일찍 보여줘도 된다' },
  { q: '아이 잠자리 독립, 언제 시작할까?', a: '되도록 일찍 시작한다', b: '아이가 원할 때까지 같이 잔다' },
  { q: '조부모님이 육아 방식에 참견하시면?', a: '존중해서 따른다', b: '우리 방식대로 한다' },
  { q: '이유식, 어떻게 준비할까?', a: '시판 제품을 활용한다', b: '직접 만들어 먹인다' },
  { q: '사교육, 언제부터 시작할까?', a: '최대한 일찍 시작한다', b: '초등학교 이후에 시작한다' },
  { q: '아이 앞에서 부부 의견이 부딪히면?', a: '절대 보이지 않는다', b: '가벼운 정도는 보여줘도 된다' },
  { q: '명절·집안 행사, 아이도 데려갈까?', a: '아이도 데리고 참석한다', b: '아이 컨디션 우선으로 빠질 수도 있다' },
  { q: '아이 용돈은 어떻게 줄까?', a: '정해진 날짜에 정액으로 준다', b: '필요할 때마다 준다' }
];

let mode = 'wife'; // 'wife' | 'husband'
let state = { name: '', round: 0, answers: [] };
let challengeData = null; // { name, answers } - 아내의 실제 답 (남편 모드에서 사용)

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function startWifeQuiz(){
  mode = 'wife';
  state.name = document.getElementById('input-name').value.trim();
  state.round = 0;
  state.answers = [];
  renderRound();
  showScreen('screen-quiz');
}

function startHusbandQuiz(){
  mode = 'husband';
  state.round = 0;
  state.answers = [];
  renderRound();
  showScreen('screen-quiz');
}

function renderBracket(){
  const wrap = document.getElementById('bracket');
  wrap.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const dotWrap = document.createElement('div');
    dotWrap.className = 'dot-wrap';
    const dot = document.createElement('div');
    dot.className = 'dot' + (i < state.round ? ' done' : (i === state.round ? ' current' : ''));
    dot.textContent = i + 1;
    dotWrap.appendChild(dot);
    if(i < QUESTIONS.length - 1){
      const seg = document.createElement('div');
      seg.className = 'seg' + (i < state.round ? ' done' : '');
      dotWrap.appendChild(seg);
    }
    wrap.appendChild(dotWrap);
  });
}

function renderRound(){
  const q = QUESTIONS[state.round];
  renderBracket();
  document.getElementById('round-label').textContent = `${state.round + 1}라운드 / ${QUESTIONS.length}`;
  document.getElementById('q-title').textContent = q.q;
  document.getElementById('q-sub').textContent = mode === 'wife' ? '솔직한 내 생각은?' : '아내라면 뭘 골랐을까요?';
  document.getElementById('opt-a-label').textContent = q.a;
  document.getElementById('opt-b-label').textContent = q.b;
}

function choose(side){
  state.answers.push(side);
  state.round++;
  if(state.round < QUESTIONS.length){
    renderRound();
  } else if(mode === 'wife'){
    submitWifeResult();
  } else {
    showFinalResult();
  }
}

async function submitWifeResult(){
  showScreen('screen-share');
  document.getElementById('my-code').value = '링크 만드는 중...';
  try {
    const response = await fetch('/api/save-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: state.name, answers: state.answers })
    });
    if (!response.ok) throw new Error('save failed');
    const data = await response.json();
    document.getElementById('my-code').value = `${location.origin}${location.pathname}?gosa=${data.id}`;
  } catch (error) {
    document.getElementById('my-code').value = '';
    document.getElementById('copy-msg').textContent = '링크 저장에 실패했어요. 새로고침 후 다시 시도해주세요.';
  }
}

function scoreMessage(correct){
  if (correct >= 9) return '찰떡궁합 부부! 텔레파시가 통하나봐요 💛';
  if (correct >= 7) return '제법 잘 통하는 편이에요 😊';
  if (correct >= 4) return '이 정도면 대화가 좀 더 필요해요 🙂';
  return '오늘 저녁, 진지한 대화 타임 어때요? 😅';
}

function showFinalResult(){
  const wifeAnswers = challengeData.answers;
  let correct = 0;
  const rows = QUESTIONS.map((q, i) => {
    const wa = wifeAnswers[i];
    const ha = state.answers[i];
    const isCorrect = wa === ha;
    if (isCorrect) correct++;
    return { q, wa, ha, isCorrect };
  });

  document.getElementById('result-eyebrow').textContent = `${challengeData.name || '아내'}님의 육아고사 결과`;
  document.getElementById('result-score').textContent = `${correct} / ${QUESTIONS.length} 문제 맞힘`;
  document.getElementById('result-message').textContent = scoreMessage(correct);

  const wrap = document.getElementById('answers-list');
  wrap.innerHTML = rows.map((r, i) => `
    <div class="answer-row ${r.isCorrect ? '' : 'wrong'}">
      <div class="answer-q">${i + 1}. ${r.q.q}</div>
      <div class="answer-compare">
        <span><span class="who">아내</span> ${r.wa === 'a' ? r.q.a : r.q.b}</span>
        <span><span class="who">남편</span> ${r.ha === 'a' ? r.q.a : r.q.b}</span>
        <span class="mark">${r.isCorrect ? '✅' : '❌'}</span>
      </div>
    </div>
  `).join('');

  showScreen('screen-result');
}

function copyCode(){
  const input = document.getElementById('my-code');
  input.select();
  document.execCommand('copy');
  document.getElementById('copy-msg').textContent = '복사했어요. 이제 남편에게 보내보세요 💌';
}

async function loadChallengeFromUrl(){
  const id = new URLSearchParams(location.search).get('gosa');
  if (!id) return;
  try {
    const response = await fetch(`/api/get-result?id=${encodeURIComponent(id)}`);
    if (!response.ok) throw new Error('load failed');
    const data = await response.json();
    challengeData = { name: data.name, answers: data.answers };
    document.getElementById('challenge-title').textContent = `${data.name || '아내'}님의 육아고사`;
    showScreen('screen-challenge');
  } catch (error) {
    document.getElementById('challenge-error').textContent = '링크를 다시 확인해 주세요.';
  }
}

loadChallengeFromUrl();
</script>
</body>
</html>
